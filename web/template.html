<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOMBcompeTItion replay</title>
<style>
  body { margin: 0; padding: 20px; background: #15181d; color: #ddd; font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; background: #000; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #status { font-family: ui-monospace, monospace; }
  input[type=range] { flex: 1; }
  button { padding: 4px 10px; }
</style>
</head>
<body>
<main>
  <div class="row"><input id="file" type="file" accept=".json"> <span>a replay saved with <code>run_match.py --replay</code></span></div>
  <canvas id="board" width="576" height="576"></canvas>
  <div class="row">
    <button id="prev">&lt;</button><button id="play">Play</button><button id="next">&gt;</button>
    <input id="slider" type="range" min="0" value="0">
  </div>
  <div id="status">Load a replay file.</div>
</main>
<script>
const SPRITES = /*SPRITES*/;
const PRELOAD = /*REPLAY*/null;
const ACTIONS = ["STAY", "UP", "DOWN", "LEFT", "RIGHT", "BOMB"];
const $ = id => document.getElementById(id);
const ctx = $("board").getContext("2d");
const img = {};
let replay = null, i = 0, timer = null;

function draw() {
  const f = replay.frames[i], n = replay.layout.length, t = $("board").width / n;
  const put = (name, [r, c]) => ctx.drawImage(img[name], c * t, r * t, t, t);
  ctx.imageSmoothingEnabled = false;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    put(`floor_${(r * 7 + c * 3) % 5 + 1}`, [r, c]);
    if (replay.layout[r][c] === "#") put("wall", [r, c]);
  }
  for (const cell of f.blast) put("blast", cell);
  ctx.font = `bold ${t / 3}px sans-serif`; ctx.fillStyle = "#fff"; ctx.textAlign = "right"; ctx.textBaseline = "top";
  for (const [r, c, owner, fuse] of f.bombs) { put(owner ? "bomb_b" : "bomb_a", [r, c]); ctx.fillText(fuse, c * t + t - 3, r * t + 2); }
  f.pos.forEach((p, k) => put(k ? "player_b" : "player_a", p));

  const acts = f.actions ? `A ${ACTIONS[f.actions[0]]}, B ${ACTIONS[f.actions[1]]}` : "-";
  const hits = f.deaths.map(([p, k]) => k === null ? `${"AB"[p]} hit by own bomb` : `${"AB"[k]} hit ${"AB"[p]}`).join(", ");
  $("status").innerHTML =
    `A: ${replay.players[0]}  vs  B: ${replay.players[1]}<br>` +
    `step ${f.step}/${replay.frames.at(-1).step}  actions: ${acts}<br>` +
    `lives ${f.lives[0]}:${f.lives[1]}  kills ${f.kills[0]}:${f.kills[1]}  ${hits}`;
  $("slider").value = i;
}
function go(k) { i = Math.max(0, Math.min(replay.frames.length - 1, k)); draw(); }
function pause() { clearInterval(timer); timer = null; $("play").textContent = "Play"; }
function load(data) {
  pause(); replay = data; $("slider").max = data.frames.length - 1; go(0);
}
$("file").onchange = async e => e.target.files[0] && load(JSON.parse(await e.target.files[0].text()));
$("prev").onclick = () => { pause(); go(i - 1); };
$("next").onclick = () => { pause(); go(i + 1); };
$("slider").oninput = e => { pause(); go(+e.target.value); };
$("play").onclick = () => {
  if (!replay) return;
  if (timer) return pause();
  if (i === replay.frames.length - 1) go(0);
  $("play").textContent = "Pause";
  timer = setInterval(() => i < replay.frames.length - 1 ? go(i + 1) : pause(), 200);
};
document.onkeydown = e => {
  if (!replay) return;
  if (e.key === "ArrowLeft") { pause(); go(i - 1); }
  if (e.key === "ArrowRight") { pause(); go(i + 1); }
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
};
Promise.all(Object.entries(SPRITES).map(([k, src]) => new Promise(res => { img[k] = new Image(); img[k].onload = res; img[k].src = src; })))
  .then(() => PRELOAD && load(PRELOAD));
</script>
</body>
</html>
